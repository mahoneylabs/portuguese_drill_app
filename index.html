<!DOCTYPE html>
<html>

<head>
<title>Portuguese Verb Trainer</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f7f7f7;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
text-align:center;
width:560px;
box-sizing:border-box;
}

h1{
color:#58cc02;
margin-top:0;
}

button{
background:#58cc02;
color:white;
border:none;
padding:10px 18px;
font-size:16px;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#46a302;
}

.conjugation-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
margin-top:25px;
}

.column{
display:flex;
flex-direction:column;
gap:14px;
}

.row{
display:grid;
grid-template-columns:140px 130px 25px 1fr;
align-items:center;
gap:6px;
}

label{
font-weight:bold;
text-align:left;
}

input{
padding:8px;
font-size:14px;
border:2px solid #ccc;
border-radius:6px;
width:100%;
box-sizing:border-box;
}

.correct{
background:#d7ffd9;
border-color:#58cc02;
}

.incorrect{
background:#ffd9d9;
border-color:#ff4b4b;
}

.result-icon{
font-size:18px;
text-align:center;
}

.correct-answer{
font-size:12px;
color:#ff4b4b;
text-align:left;
}

#result{
margin-top:22px;
font-weight:bold;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>Portuguese Verb Trainer</h1>

<button onclick="newVerb()">New Verb</button>

<h2 id="verb"></h2>
<h3 id="translation"></h3>

<div class="conjugation-grid">

<div class="column">

<div class="row">
<label>eu</label>
<input id="eu">
<span id="eu-icon" class="result-icon"></span>
<span id="eu-correct" class="correct-answer"></span>
</div>

<div class="row">
<label>tu</label>
<input id="tu">
<span id="tu-icon" class="result-icon"></span>
<span id="tu-correct" class="correct-answer"></span>
</div>

<div class="row">
<label>ele / ela / você</label>
<input id="ele">
<span id="ele-icon" class="result-icon"></span>
<span id="ele-correct" class="correct-answer"></span>
</div>

</div>

<div class="column">

<div class="row">
<label>nós</label>
<input id="nos">
<span id="nos-icon" class="result-icon"></span>
<span id="nos-correct" class="correct-answer"></span>
</div>

<div class="row">
<label>vós</label>
<input id="vos">
<span id="vos-icon" class="result-icon"></span>
<span id="vos-correct" class="correct-answer"></span>
</div>

<div class="row">
<label>eles / elas / vocês</label>
<input id="eles">
<span id="eles-icon" class="result-icon"></span>
<span id="eles-correct" class="correct-answer"></span>
</div>

</div>

</div>

<button onclick="checkAnswer()">Check Answers</button>

<p id="result"></p>

</div>

<script src="script.js"></script>

</body>
</html>
